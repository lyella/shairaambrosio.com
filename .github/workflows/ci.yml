name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # This job name is what scripts/deploy-gate.sh looks for in the commit's check
    # runs before Vercel is allowed to deploy production. Renaming it means updating
    # REQUIRED_CHECK in that script too.
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: yarn tsc

      - name: Lint
        # `yarn lint` used to be `next lint`, which Next 16 removed. It now runs
        # flat-config ESLint, so this step can actually fail the build again.
        run: yarn lint

      - name: Check formatting
        # Baseline is clean and .gitattributes normalises line endings, so this
        # gate is meaningful rather than permanently red.
        run: yarn format:check

      - name: Unit tests
        run: yarn test

      - name: Deploy gate tests
        # The gate decides whether production deploys; if its logic breaks it would
        # either block every deploy or let a red build through.
        run: bash ./scripts/test-deploy-gate.sh

      - name: Security audit gate
        # yarn audit --level never filters or fails deterministically, so the gate
        # parses the JSON and decides on severity itself.
        run: yarn audit:gate

      - name: Generate feed, sitemap and newest-post redirect
        run: |
          yarn new-post-redirect
          yarn feed
          yarn sitemap

      - name: Guard against a placeholder redirect in next.config.js
        # generateNewPostRedirect only rewrites the first match, so a config that
        # was committed mid-generation can keep a placeholder destination.
        run: |
          if grep -q "THE_NEWEST_POST_SLUG_HERE" next.config.js; then
            echo "::error::next.config.js still contains THE_NEWEST_POST_SLUG_HERE"
            exit 1
          fi

      - name: Production build
        run: yarn next build --webpack
        env:
          NEXT_PUBLIC_HOST: shairaambrosio.com
          NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
          NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}

      # Last, so every check above must already have passed. This step mutates the
      # live search index, and it used to run mid-job: a commit that failed the
      # build afterwards had still rewritten production search.
      - name: Update Algolia search index
        if: github.ref == 'refs/heads/main'
        run: yarn algolia
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_UPDATE_API_KEY: ${{ secrets.ALGOLIA_UPDATE_API_KEY }}
